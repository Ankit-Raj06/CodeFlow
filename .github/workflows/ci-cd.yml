name: CodeFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run tests
        run: npm test

  build:
    name: Docker Build and Smoke Test
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t codeflow .
      - name: Start container
        run: docker run -d --name codeflow-test -p 3000:3000 codeflow
      - name: Wait for application
        run: sleep 5
      - name: Smoke test
        run: curl --fail http://localhost:3000/health

  deploy:
    name: Deploy to Render
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        run: curl --fail --request POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
