<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>CodeFlow</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<header class="topbar">
  <div>
    <span class="eyebrow">CODEFLOW</span>

    <h1>Pull Request Review Management</h1>

    <p>
      Track reviews from open request to merge.
    </p>
  </div>

  <span id="health" class="health">
    Checking server...
  </span>
</header>

<main class="container">

  <section
    class="stats"
    id="stats"
  ></section>

  <section class="panel">

    <h2>Create Review Request</h2>

    <p>
      Add a review request to the workflow.
    </p>

    <form
      id="reviewForm"
      class="form-grid"
    >

      <input
        id="title"
        placeholder="Review title"
        required
      >

      <input
        id="developer"
        placeholder="Developer name"
        required
      >

      <input
        id="reviewer"
        placeholder="Reviewer name"
        required
      >

      <select
        id="priority"
        required
      >
        <option value="">Priority</option>
        <option>Low</option>
        <option>Medium</option>
        <option>High</option>
      </select>

      <button type="submit">
        Create Review
      </button>

    </form>

    <p
      id="message"
      class="message"
    ></p>

  </section>

  <section class="panel">

    <div class="toolbar">

      <div>
        <h2>Review Queue</h2>

        <p>
          Search and manage review requests.
        </p>
      </div>

      <div class="toolbar-controls">

        <input
          id="search"
          type="search"
          placeholder="Search reviews..."
        >

        <select id="filter">

          <option value="">
            All statuses
          </option>

          <option>
            Open
          </option>

          <option>
            In Review
          </option>

          <option>
            Changes Requested
          </option>

          <option>
            Approved
          </option>

          <option>
            Merged
          </option>

        </select>

      </div>

    </div>

    <div
      id="reviews"
      class="review-list"
    ></div>

  </section>

</main>

<script src="/app.js"></script>

</body>
</html>
